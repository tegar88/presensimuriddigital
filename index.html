<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistem Presensi Digital Sekolah" />
  <title>ABSEN MURID — Digital Attendance</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📋</text></svg>" />
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <div class="login-logo">📋</div>
      <h1>ABSEN MURID</h1>
      <p class="login-tagline">Digital Attendance System</p>
      <form id="loginForm">
        <label>Admin / Guru Secret</label>
        <input type="password" id="loginSecret" placeholder="Masukkan secret" required autocomplete="current-password" />
        <label>Role</label>
        <select id="loginRole">
          <option value="ADMIN">Admin</option>
          <option value="GURU">Guru</option>
          <option value="OPERATOR">Operator</option>
        </select>
        <button type="submit" class="btn btn-primary btn-block">Masuk</button>
      </form>
      <p class="login-hint">Secret sesuai yang ada di sheet CONFIG → secret_api</p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app" class="app hidden">
    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <span class="brand-icon">📋</span>
          <div>
            <div class="brand-name">ABSEN MURID</div>
            <div class="brand-sub" id="schoolName">SMP</div>
          </div>
        </div>
      </div>
      <nav class="nav-menu" id="navMenu">
        <a href="#/dashboard" class="nav-item active" data-page="dashboard" data-role="ADMIN,GURU,OPERATOR">
          <span class="nav-icon">📊</span><span>Dashboard</span>
        </a>
        <a href="#/live" class="nav-item" data-page="live" data-role="ADMIN,GURU">
          <span class="nav-icon">📡</span><span>Live Attendance</span>
        </a>
        <a href="#/manual" class="nav-item" data-page="manual" data-role="ADMIN,GURU">
          <span class="nav-icon">✍️</span><span>Presensi Manual</span>
        </a>
        <a href="#/permissions" class="nav-item" data-page="permissions" data-role="ADMIN,GURU">
          <span class="nav-icon">📝</span><span>Pengajuan Izin</span>
        </a>
        <a href="#/verify" class="nav-item" data-page="verify" data-role="ADMIN,GURU">
          <span class="nav-icon">✅</span><span>Verifikasi Izin</span>
        </a>
        <a href="#/students" class="nav-item" data-page="students" data-role="ADMIN,OPERATOR">
          <span class="nav-icon">👥</span><span>Data Siswa</span>
        </a>
        <a href="#/cards" class="nav-item" data-page="cards" data-role="ADMIN,OPERATOR">
          <span class="nav-icon">💳</span><span>Kartu RFID</span>
        </a>
        <a href="#/reports" class="nav-item" data-page="reports" data-role="ADMIN,GURU,OPERATOR">
          <span class="nav-icon">📈</span><span>Rekap</span>
        </a>
        <a href="#/devices" class="nav-item" data-page="devices" data-role="ADMIN">
          <span class="nav-icon">📟</span><span>Device</span>
        </a>
        <a href="#/config" class="nav-item" data-page="config" data-role="ADMIN">
          <span class="nav-icon">⚙️</span><span>Konfigurasi</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-info">
          <span id="userRole">ADMIN</span>
          <button class="btn-logout" id="btnLogout" title="Keluar">🚪</button>
        </div>
      </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="main-content">
      <header class="topbar">
        <button class="btn-icon" id="btnToggleSidebar" title="Menu">☰</button>
        <h2 class="page-title" id="pageTitle">Dashboard</h2>
        <div class="topbar-right">
          <span class="clock" id="clock">--:--:--</span>
        </div>
      </header>
      <section class="page-content" id="pageContent">
        <!-- Konten dinamis -->
      </section>
    </main>
  </div>

  <!-- TOAST -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- MODAL -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal" id="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Judul</h3>
        <button class="btn-icon" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/attendance.js"></script>
  <script src="js/students.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/permissions.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/devices.js"></script>
</body>
</html>
